plugins {
    id 'com.android.application'
}

android {
    namespace 'app.lifegram.widget'
    compileSdk 35

    defaultConfig {
        applicationId 'app.lifegram.widget'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Sem bibliotecas: so o SDK do Android. O APK fica com poucos KB.
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Assinado com a chave de debug: e um app pessoal, instalado a mao.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
