<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cinco elementos">
  <!--
    Versao maskable: o Android recorta o icone num circulo/squircle, entao o
    desenho vem reduzido a 68% e centrado, dentro da zona segura. O fundo
    sangra ate a borda de proposito — quem recorta e o sistema.
  -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#7c6cf0" stop-opacity="0" />
      <stop offset="84%" stop-color="#9a8bff" stop-opacity=".38" />
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#05060c" />
  <g transform="translate(256 262) scale(0.68) translate(-256 -262)">
  <circle cx="256" cy="262" r="210" fill="url(#halo)" />

  <g fill="none" stroke-linecap="round">
    <!-- camada de brilho: o mesmo desenho, borrado por tras -->
    <g stroke="#6f6bf0" stroke-width="20" filter="url(#glow)" opacity=".95">
      <path d="M322.4 105.5 A170 170 0 0 1 384.3 150.5" />
      <path d="M425.4 276.8 A170 170 0 0 1 401.7 349.6" />
      <path d="M294.2 427.6 A170 170 0 0 1 217.8 427.6" />
      <path d="M110.3 349.6 A170 170 0 0 1 86.6 276.8" />
      <path d="M127.7 150.5 A170 170 0 0 1 189.6 105.5" />
      <path d="M275.2 151.0L336.8 340.6" />
      <path d="M236.8 151.0L175.2 340.6" />
      <path d="M367.5 245.9L206.2 363.1" />
      <path d="M355.7 209.5L156.3 209.5" />
      <path d="M305.8 363.1L144.5 245.9" />
    </g>

    <!-- traco nitido por cima do brilho -->
    <g stroke="#aeb0ff" stroke-width="17">
      <path d="M322.4 105.5 A170 170 0 0 1 384.3 150.5" />
      <path d="M425.4 276.8 A170 170 0 0 1 401.7 349.6" />
      <path d="M294.2 427.6 A170 170 0 0 1 217.8 427.6" />
      <path d="M110.3 349.6 A170 170 0 0 1 86.6 276.8" />
      <path d="M127.7 150.5 A170 170 0 0 1 189.6 105.5" />
      <path d="M275.2 151.0L336.8 340.6" />
      <path d="M236.8 151.0L175.2 340.6" />
      <path d="M367.5 245.9L206.2 363.1" />
      <path d="M355.7 209.5L156.3 209.5" />
      <path d="M305.8 363.1L144.5 245.9" />
    </g>
  </g>

  <!-- nos: disco quase preto com anel roxo aceso -->
  <g fill="#080a14" stroke="#7f7bf5" stroke-width="10" filter="url(#glow)" opacity=".8">
    <circle cx="256" cy="92" r="52" />
    <circle cx="417.7" cy="209.5" r="52" />
    <circle cx="355.9" cy="399.5" r="52" />
    <circle cx="156.1" cy="399.5" r="52" />
    <circle cx="94.3" cy="209.5" r="52" />
  </g>
  <g fill="#080a14" stroke="#aeb0ff" stroke-width="7">
    <circle cx="256" cy="92" r="52" />
    <circle cx="417.7" cy="209.5" r="52" />
    <circle cx="355.9" cy="399.5" r="52" />
    <circle cx="156.1" cy="399.5" r="52" />
    <circle cx="94.3" cy="209.5" r="52" />
  </g>

  <!-- topo: estrela branca de oito pontas -->
  <g transform="translate(256 92)" fill="#ffffff">
    <path d="M0-21 6-6 21 0 6 6 0 21 -6 6 -21 0 -6-6Z" transform="rotate(45)" opacity=".9" />
    <path d="M0-34 7-7 34 0 7 7 0 34 -7 7 -34 0 -7-7Z" />
  </g>

  <!-- direita: gota d'agua -->
  <g transform="translate(417.7 209.5)">
    <path d="M0-32C0-32 22-8 22 6A22 22 0 0 1-22 6C-22-8 0-32 0-32Z" fill="#3b82f6" />
    <path d="M-20 14C-10 24 12 22 22 10 12 26-12 28-20 14Z" fill="#1e40af" />
    <path
      d="M-7-13C-13-4-16 1-16 7"
      fill="none"
      stroke="#bfdbfe"
      stroke-width="5"
      stroke-linecap="round"
      opacity=".75"
    />
  </g>

  <!-- inferior direito: chama -->
  <g transform="translate(355.9 399.5)">
    <path
      d="M2-32C14-16 26-6 26 8A26 26 0 0 1-26 8C-26-4-18-12-12-22-10-10-4-8 0-12-2-20 0-27 2-32Z"
      fill="#ea580c"
    />
    <path d="M3-8C10 1 13 6 13 11A13 13 0 0 1-13 11C-13 5-7 1-3-5-2 2 2 2 3-8Z" fill="#fbbf24" />
  </g>

  <!-- inferior esquerdo: broto na terra -->
  <g transform="translate(156.1 399.5)">
    <path d="M0 14V-6" stroke="#3faa62" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M0-4C-4-20-18-24-26-22-24-10-12-2 0-4Z" fill="#22c55e" />
    <path d="M2-8C4-22 16-28 26-26 24-14 14-4 2-8Z" fill="#4ade80" />
    <path d="M-28 20A28 12 0 0 1 28 20Z" fill="#6b4a32" />
  </g>

  <!-- esquerda: vento -->
  <g
    transform="translate(94.3 209.5)"
    fill="none"
    stroke="#7dd3fc"
    stroke-width="6.5"
    stroke-linecap="round"
  >
    <path d="M-27-13H6A10 10 0 1 0-4-23" />
    <path d="M-27 3H16A10 10 0 1 1 6 13" />
    <path d="M-27 18H-2" />
  </g>
  </g>
</svg>
